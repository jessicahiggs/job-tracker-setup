<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Job Application Tracker</title>
<style>
:root{ color-scheme: light; } *{ box-sizing:border-box; }
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f7f7f8; color:#1c1c1e; }
.wrap{ max-width:1100px; margin:0 auto; padding:20px 18px 60px; }
h1{ font-size:20px; margin:0 0 2px; } .sub{ color:#6b6b70; font-size:12.5px; margin-bottom:16px; }
.cards{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.card{ flex:1 1 120px; background:#fff; border:1px solid #e6e6e9; border-radius:12px; padding:12px 14px; }
.card .n{ font-size:24px; font-weight:650; line-height:1; } .card .l{ font-size:11.5px; color:#6b6b70; margin-top:5px; text-transform:uppercase; letter-spacing:.03em; }
.card.applied .n{ color:#2563eb; } .card.interviewing .n{ color:#b45309; } .card.rejected .n{ color:#9ca3af; } .card.offer .n{ color:#15803d; }
.controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
.controls input{ flex:1 1 200px; padding:8px 11px; border:1px solid #dcdce0; border-radius:9px; font-size:13.5px; background:#fff; }
.chip{ padding:6px 11px; border:1px solid #dcdce0; border-radius:999px; background:#fff; font-size:12.5px; cursor:pointer; color:#3a3a3e; }
.chip.on{ background:#1c1c1e; color:#fff; border-color:#1c1c1e; }
table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid #e6e6e9; border-radius:12px; overflow:hidden; }
th,td{ text-align:left; padding:9px 12px; font-size:13px; border-bottom:1px solid #efeff1; vertical-align:top; }
th{ background:#fafafb; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:#6b6b70; cursor:pointer; user-select:none; white-space:nowrap; }
tr:last-child td{ border-bottom:none; } td.company{ font-weight:600; white-space:nowrap; } td.role{ color:#2a2a2e; }
td.date{ white-space:nowrap; color:#6b6b70; font-variant-numeric:tabular-nums; } td.notes{ color:#6b6b70; font-size:12px; max-width:300px; }
.badge{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.b-applied{ background:#e6efff; color:#1d4ed8; } .b-interviewing{ background:#fef3c7; color:#92400e; } .b-rejected{ background:#f1f1f3; color:#6b7280; } .b-offer{ background:#dcfce7; color:#15803d; }
.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:#7c3aed; margin-left:6px; vertical-align:middle; }
.foot{ margin-top:12px; font-size:11.5px; color:#8a8a90; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
.updates{ background:#faf5ff; border:1px solid #e9d5ff; border-radius:12px; padding:11px 14px; margin-bottom:14px; font-size:12.5px; color:#5b21b6; }
.updates b{ color:#4c1d95; } .updates ul{ margin:6px 0 0; padding-left:18px; } .updates li{ margin:2px 0; }
</style></head><body><div class="wrap">
<h1>Job Application Tracker</h1>
<div class="sub">Maintained automatically from your inbox. <span id="synced"></span></div>
<div class="cards" id="cards"></div><div class="updates" id="updates" style="display:none"></div>
<div class="controls"><input id="q" type="text" placeholder="Search company, role, notes…" autocomplete="off">
<span class="chip on" data-f="all">All</span><span class="chip" data-f="Applied">Applied</span><span class="chip" data-f="Interviewing">Interviewing</span><span class="chip" data-f="Offer">Offer</span><span class="chip" data-f="Rejected">Rejected</span></div>
<table id="tbl"><thead><tr><th data-s="company">Company</th><th data-s="role">Role</th><th data-s="status">Status</th><th data-s="date">Applied</th><th data-s="notes">Notes</th></tr></thead><tbody id="tbody"></tbody></table>
<div class="foot"><span id="count"></span><span>A purple dot = updated in the last sync. Original notes are always preserved; new developments are appended with a [MM/DD] tag.</span></div>
</div><script>
const LAST_SYNC = "{{LAST_SYNC}}"; const RECENT_CHANGES = {{RECENT_CHANGES}}; const DATA = {{DATA}};
const NORM = s => (s||"").toLowerCase(); let FILTER="all", SORT="date", DIR=-1;
document.getElementById("synced").textContent = "Last sync: " + LAST_SYNC;
const counts={Applied:0,Interviewing:0,Offer:0,Rejected:0}; DATA.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);
document.getElementById("cards").innerHTML = card("applied",counts.Applied,"Applied")+card("interviewing",counts.Interviewing,"Interviewing")+card("offer",counts.Offer,"Offer")+card("rejected",counts.Rejected,"Rejected")+card("",DATA.length,"Total");
function card(cls,n,l){ return '<div class="card '+cls+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
if(RECENT_CHANGES.length){ const u=document.getElementById("updates"); u.style.display="block"; u.innerHTML="<b>Changed in last sync:</b><ul>"+RECENT_CHANGES.map(c=>"<li>"+esc(c)+"</li>").join("")+"</ul>"; }
function esc(s){ return (s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function draw(){ const q=NORM(document.getElementById("q").value);
  let rows=DATA.filter(r=>(FILTER==="all"||r.status===FILTER) && (!q||NORM(r.company+" "+r.role+" "+r.notes).includes(q)));
  rows.sort((a,b)=>{let x=a[SORT]||"",y=b[SORT]||"";return (x<y?-1:x>y?1:0)*DIR;});
  document.getElementById("tbody").innerHTML=rows.map(r=>{ const sc={Applied:"b-applied",Interviewing:"b-interviewing",Offer:"b-offer",Rejected:"b-rejected"}[r.status]||"b-applied";
    const dot=r.changed?'<span class="dot" title="updated in last sync"></span>':'';
    return "<tr><td class='company'>"+esc(r.company)+"</td><td class='role'>"+esc(r.role)+"</td><td><span class='badge "+sc+"'>"+r.status+"</span>"+dot+"</td><td class='date'>"+esc(r.date)+"</td><td class='notes'>"+esc(r.notes)+"</td></tr>"; }).join("");
  document.getElementById("count").textContent=rows.length+" of "+DATA.length+" shown"; }
document.getElementById("q").addEventListener("input",draw);
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); FILTER=c.dataset.f; draw(); }));
document.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{ const s=th.dataset.s; if(s===SORT) DIR=-DIR; else {SORT=s; DIR=1;} draw(); }));
draw();
</script></body></html>
